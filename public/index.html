<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bybit Perp Screener</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo">⚡</span>
        <div>
          <h1>Bybit Perp Screener</h1>
          <p class="subtitle" id="subtitle">volume delta en tiempo real</p>
        </div>
      </div>
      <div class="status">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">conectando…</span>
      </div>
    </header>

    <section class="toolbar">
      <label class="search">
        <span aria-hidden="true">⌕</span>
        <input id="search" type="search" placeholder="Buscar par…  (tecla /)" autocomplete="off" />
      </label>

      <div class="chips" id="quote-chips"></div>

      <button class="toggle" id="only-favs" title="Mostrar solo favoritos">★ Favoritos</button>

      <label class="field">
        Vol 24h ≥
        <input id="min-vol" type="text" inputmode="decimal" placeholder="0" size="6"
               title="Volumen mínimo de 24 h en USD. Admite atajos: 500k, 1.5m, 2b" />
      </label>

      <label class="field">
        |Δ| ≥
        <input id="min-delta" type="text" inputmode="decimal" placeholder="0" size="6"
               title="Delta mínimo en USD (valor absoluto) del timeframe por el que ordenas. Admite 500k, 1.5m, 2b" />
      </label>

      <label class="field">
        Δ
        <select id="delta-dir">
          <option value="all">todos</option>
          <option value="buy">compras</option>
          <option value="sell">ventas</option>
        </select>
      </label>

      <details class="menu" id="tf-menu">
        <summary>Timeframes</summary>
        <div class="menu-body" id="tf-options"></div>
      </details>

      <details class="menu" id="col-menu">
        <summary>Columnas</summary>
        <div class="menu-body">
          <label><input type="checkbox" id="opt-tf-volume" /> Volumen por timeframe</label>
          <label><input type="checkbox" id="opt-delta-pct" /> Δ como % del volumen</label>
          <label><input type="checkbox" id="opt-oi" /> Open interest</label>
          <label><input type="checkbox" id="opt-funding" /> Funding</label>
          <label><input type="checkbox" id="opt-favs-first" /> Favoritos arriba</label>
        </div>
      </details>
    </section>

    <p class="banner" id="banner" hidden></p>

    <main class="table" id="table">
      <div class="table-inner">
        <div class="thead" id="thead"></div>
        <div class="viewport" id="viewport">
          <div class="canvas" id="canvas"></div>
          <p class="empty" id="empty" hidden>Ningún par cumple los filtros.</p>
        </div>
      </div>
    </main>

    <footer class="statusbar">
      <span id="count">—</span>
      <span id="updated">—</span>
      <span id="coverage"></span>
      <span id="throughput"></span>
    </footer>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
